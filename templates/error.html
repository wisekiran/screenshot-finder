<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — Screenshot Finder</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="shell">
        <nav aria-label="Main navigation">
            <a class="brand" href="{{ url_for('home') }}">
                <span class="brand-icon" aria-hidden="true">⌗</span>
                screenshot finder
            </a>
        </nav>

        <main>
            <header class="hero">
                <span class="stamp">A SMALL SETBACK</span>
                <h1>{{ title }}</h1>
                <p class="description">{{ message }}</p>
            </header>

            <p>
                <a class="text-link" href="{{ url_for('home') }}">
                    Back to the evidence desk ↗
                </a>
            </p>
        </main>
    </div>
</body>
</html>
